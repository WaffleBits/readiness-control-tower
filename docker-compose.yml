services:
  backend:
    build:
      context: ./backend
    environment:
      DATA_DIR: /app/data/synthetic
    volumes:
      - ./data/synthetic:/app/data/synthetic:ro
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend

